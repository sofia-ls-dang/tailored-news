<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F5F1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Daily Intelligence" />
  <title>Daily Intelligence</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'] },
          colors: {
            canvas: '#F6F5F1',
            ink: '#1B1F2A',
            accent: '#3B5BDB'
          }
        }
      }
    };
  </script>

  <style>
    html { -webkit-text-size-adjust: 100%; }
    body { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    .safe-bottom { padding-bottom: max(0.75rem, env(safe-area-inset-bottom)); }
    .safe-top { padding-top: max(1rem, env(safe-area-inset-top)); }
    .safe-top-sm { padding-top: max(0.5rem, env(safe-area-inset-top)); }
    .clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    :focus-visible { outline: 3px solid #3B5BDB; outline-offset: 2px; border-radius: 12px; }

    /* Reader typography (driven by the Aa settings) */
    :root {
      --reader-font: 'Atkinson Hyperlegible', 'Inter', system-ui, sans-serif;
      --reader-size: 18px;
    }
    .reader-font { font-family: var(--reader-font); }
    .reader-body { font-size: var(--reader-size); line-height: 1.8; letter-spacing: 0.005em; }
    .reader-body p + p { margin-top: 1.4em; }
    .reader-facts { font-size: calc(var(--reader-size) - 1px); line-height: 1.6; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>

<body class="bg-canvas text-ink font-sans antialiased">
  <!-- App shell: centered column so it looks intentional on desktop -->
  <div class="relative mx-auto min-h-screen w-full max-w-md bg-canvas md:border-x md:border-black/5">

    <!-- ============================ HOME VIEW ============================ -->
    <div id="homeView">
      <header class="safe-top px-5 pb-3">
        <p id="todayLabel" class="text-xs font-medium uppercase tracking-wider text-ink/50"></p>
        <h1 class="text-2xl font-extrabold tracking-tight">Daily Intelligence</h1>
      </header>

      <main class="px-5 pb-32">
        <!-- Hero / Featured -->
        <section aria-label="Top story" id="hero" class="mb-6"></section>

        <!-- Category tabs -->
        <nav aria-label="Categories" class="-mx-5 mb-4">
          <div id="tabs" role="tablist" class="no-scrollbar flex gap-2 overflow-x-auto px-5 py-1"></div>
        </nav>

        <!-- Feed -->
        <section aria-label="News feed">
          <div id="feed" class="flex flex-col gap-3" role="tabpanel"></div>
          <p id="empty" class="hidden py-12 text-center text-sm text-ink/50">Nothing here yet. You're all caught up.</p>
        </section>
      </main>
    </div>

    <!-- ============================ SAVED VIEW =========================== -->
    <div id="savedView" class="hidden">
      <header class="safe-top px-5 pb-3">
        <p id="savedCount" class="text-xs font-medium uppercase tracking-wider text-ink/50"></p>
        <h1 class="text-2xl font-extrabold tracking-tight">Saved</h1>
      </header>

      <main class="px-5 pb-32">
        <div id="savedList" class="flex flex-col gap-3"></div>

        <div id="savedEmpty" class="hidden rounded-3xl bg-white px-6 py-12 text-center ring-1 ring-black/5">
          <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-[#EEF1FD] text-accent">
            <svg class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z" /></svg>
          </div>
          <p class="mb-1 text-lg font-bold">Nothing saved yet</p>
          <p class="mb-6 text-sm text-ink/60">Tap the bookmark on any story to keep it here for later.</p>
          <a href="#/" class="inline-flex h-12 items-center rounded-full bg-ink px-6 font-semibold text-white">Browse today's stories</a>
        </div>
      </main>
    </div>

    <!-- ============================ READER VIEW ========================== -->
    <div id="readerView" class="hidden">
      <!-- Thin reading progress bar -->
      <div class="fixed inset-x-0 top-0 z-30 mx-auto h-1 w-full max-w-md bg-transparent">
        <div id="progress" class="h-full w-0 bg-accent"></div>
      </div>

      <!-- Sticky top bar -->
      <div class="sticky top-0 z-20 bg-canvas/90 backdrop-blur">
        <div class="safe-top-sm relative flex items-center justify-between px-4 pb-2">
          <button type="button" data-back aria-label="Back to feed"
            class="flex h-12 w-12 items-center justify-center rounded-full bg-white shadow-sm ring-1 ring-black/5 active:scale-95 transition">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" /></svg>
          </button>

          <div class="flex items-center gap-2">
            <button id="prefsToggle" type="button" aria-label="Text settings" aria-expanded="false"
              class="flex h-12 w-12 items-center justify-center rounded-full bg-white text-base font-bold shadow-sm ring-1 ring-black/5 active:scale-95 transition">
              Aa
            </button>
            <button id="readerBookmark" type="button" data-bookmark="" aria-pressed="false" aria-label="Bookmark story"
              class="flex h-12 w-12 items-center justify-center rounded-full bg-white shadow-sm ring-1 ring-black/5 active:scale-95 transition"></button>
          </div>

            <div class="mb-4 grid grid-cols-2 gap-2">

              <button type="button" data-font="inter" class="rounded-2xl px-3 py-3 text-sm font-semibold ring-1 ring-black/10" style="font-family:'Inter',sans-serif">Inter</button>
            </div>

        </div>

      <main id="readerContent" class="reader-font px-5 pb-16 pt-2"></main>

          </button>
        </nav>
      </div>
    </div>

    <!-- Toast -->

  </div>

  <script>
    /* ------------------------------------------------------------------

    /* ------------------------------ State ------------------------------ */
    const STORAGE_KEY = 'di_bookmarks_v2';   // full article snapshots, so saved stories survive daily feed refreshes
    const LEGACY_KEY = 'di_bookmarks_v1';    // ids only (Steps 1-2)
    const PREFS_KEY = 'di_reader_prefs_v1';
    const FONT_STACKS = {
      atkinson: "'Atkinson Hyperlegible', 'Inter', system-ui, sans-serif",
      inter: "'Inter', system-ui, sans-serif"
    };
    const SIZES = [16, 18, 20, 22, 24];

    const state = {
      tab: 'latest',
      view: 'home',          // 'home' | 'reader'
      articleId: null,
      feedScroll: 0,
      cameFromFeed: false,
      returnTo: 'home',      // which list the reader was opened from ('home' | 'saved')
      savedSession: [],      // stories shown in the Saved view this visit (so un-saved cards don't vanish instantly)
      bookmarks: loadBookmarks(),   // Map: id -> article snapshot
      prefs: Object.assign({ font: 'atkinson', sizeIndex: 1 }, loadJSON(PREFS_KEY, {}))
    };

    function loadJSON(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) || fallback; }
      catch (e) { return fallback; }
    }
    function saveJSON(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); }
      catch (e) { /* storage unavailable: keep in-memory only */ }
    }
    const saveBookmarks = () => saveJSON(STORAGE_KEY, [...state.bookmarks.values()]);

    // Freeze an article so it can still be read after it leaves the live feed.
    function snapshot(a) {
      const s = JSON.parse(JSON.stringify(a));
      if (!s.publishedAt && typeof s.minutesAgo === 'number') {
        s.publishedAt = new Date(Date.now() - s.minutesAgo * 60000).toISOString();
      }
      delete s.minutesAgo;
      delete s.featured;
      s.savedAt = Date.now();
      return s;
    }

    function loadBookmarks() {
      const map = new Map();
      loadJSON(STORAGE_KEY, []).forEach((a) => { if (a && a.id) map.set(a.id, a); });
      // Migrate ids saved by the earlier version, then retire the old key
      const legacy = loadJSON(LEGACY_KEY, []);
      if (legacy.length) {
        legacy.forEach((id) => {
          const a = ARTICLES.find((x) => x.id === id);
          if (a && !map.has(id)) map.set(id, snapshot(a));
        });
        saveJSON(STORAGE_KEY, [...map.values()]);
        try { localStorage.removeItem(LEGACY_KEY); } catch (e) { /* ignore */ }
      }
      return map;
    }

    // Live feed first, then saved copies, then anything shown in this Saved visit
    const getArticle = (id) =>
      ARTICLES.find((x) => x.id === id) ||
      state.bookmarks.get(id) ||
      state.savedSession.find((x) => x.id === id);
    const savePrefs = () => saveJSON(PREFS_KEY, state.prefs);

    /* ------------------------------ Helpers ---------------------------- */
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    function esc(str) {
      return String(str).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function safeUrl(u) {
      try {
        const parsed = new URL(u);
        return (parsed.protocol === 'https:' || parsed.protocol === 'http:') ? parsed.href : '#';
      } catch (e) { return '#'; }
    }

    function timeAgo(mins) {
      if (mins < 1) return 'Just now';
      if (mins < 60) return mins + 'm ago';
      const h = Math.floor(mins / 60);
      if (h < 24) return h + 'h ago';
      return Math.floor(h / 24) + 'd ago';
    }

    function minutesSince(a) {
      if (typeof a.minutesAgo === 'number') return a.minutesAgo;
      if (a.publishedAt) return Math.max(0, Math.round((Date.now() - new Date(a.publishedAt)) / 60000));
      return 0;
    }

    // Image tile that degrades to a plain gray block when the image is missing or fails to load
    function thumb(src, wrapCls) {
      const img = src
        ? `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer"
             class="h-full w-full object-cover" onerror="this.style.display='none'" />`
        : '';
      return `<div class="${wrapCls} overflow-hidden bg-ink/10">${img}</div>`;
    }

    function bookmarkIcon(active, size = 'h-6 w-6') {
      return `<svg class="${size}" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"
        fill="${active ? 'currentColor' : 'none'}" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z"/>
      </svg>`;
    }

    let toastTimer;
    function toast(msg) {
      const el = $('#toast');
      el.textContent = msg;
      el.classList.remove('opacity-0', 'translate-y-2');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('opacity-0', 'translate-y-2'), 1800);
    }

    /* ---------------------------- Home render -------------------------- */
    function renderHero() {
      const a = ARTICLES.find((x) => x.featured) || ARTICLES[0];
      if (!a) { $('#hero').innerHTML = ''; return; }
      const saved = state.bookmarks.has(a.id);
      $('#hero').innerHTML = `
        <article class="relative h-80 overflow-hidden rounded-[28px] bg-ink shadow-lg shadow-black/10">
          ${(a.imageLarge || a.image) ? `<img src="${esc(a.imageLarge || a.image)}" alt="" referrerpolicy="no-referrer" class="absolute inset-0 h-full w-full object-cover" loading="eager" onerror="this.style.display='none'" />` : ''}
          <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/50 to-black/10"></div>

          <!-- Whole card opens the article -->
          <a href="#/article/${encodeURIComponent(a.id)}" aria-label="Read: ${esc(a.headline)}"
             class="absolute inset-0 z-10 rounded-[28px]"></a>

          <div class="pointer-events-none absolute inset-x-0 top-0 z-20 flex items-start justify-between p-4">
            <span class="rounded-full bg-white px-3 py-1.5 text-xs font-bold uppercase tracking-wide text-ink">${esc(a.categoryLabel)}</span>
            <button type="button" data-bookmark="${esc(a.id)}" aria-pressed="${saved}" aria-label="${saved ? 'Remove bookmark' : 'Bookmark story'}"
              class="pointer-events-auto flex h-12 w-12 items-center justify-center rounded-full bg-white/90 text-ink backdrop-blur active:scale-95 transition">
              ${bookmarkIcon(saved)}
            </button>
          </div>

          <div class="absolute inset-x-0 bottom-0 p-5 text-white">
            <p class="mb-2 flex items-center gap-2 text-xs font-semibold text-white/80">
              <span>${esc(a.publisher)}</span><span aria-hidden="true">•</span>
              <span>${a.readMinutes} min read</span><span aria-hidden="true">•</span>
              <span>${timeAgo(minutesSince(a))}</span>
            </p>
            <h2 class="text-[22px] font-extrabold leading-tight tracking-tight">${esc(a.headline)}</h2>
          </div>
        </article>`;
    }

    function renderTabs() {
      $('#tabs').innerHTML = CATEGORIES.map((c) => {
        const active = c.id === state.tab;
        return `<button type="button" role="tab" aria-selected="${active}" data-tab="${c.id}"
          class="shrink-0 rounded-full px-5 py-3 text-sm font-semibold transition active:scale-95
          ${active ? 'bg-ink text-white shadow-md' : 'bg-white text-ink/70 ring-1 ring-black/5'}">${esc(c.label)}</button>`;
      }).join('');
    }

    function renderFeed() {
      const heroId = (ARTICLES.find((x) => x.featured) || ARTICLES[0] || {}).id;
      const items = ARTICLES
        .filter((a) => a.id !== heroId)
        .filter((a) => state.tab === 'latest' || a.category === state.tab)
        .sort((a, b) => minutesSince(a) - minutesSince(b));

      $('#empty').classList.toggle('hidden', items.length > 0);

      $('#feed').innerHTML = items.map((a) => cardHTML(a)).join('');
    }

    // Shared card used by the feed and the Saved view
    function cardHTML(a, dimUnsaved) {
        const saved = state.bookmarks.has(a.id);
        return `
        <article class="relative flex items-center gap-4 rounded-3xl bg-white p-3 shadow-sm ring-1 ring-black/5 transition ${dimUnsaved && !saved ? 'opacity-60' : ''}">
          ${thumb(a.image, 'h-28 w-28 shrink-0 rounded-2xl')}
          <div class="min-w-0 flex-1">
            <div>
              <p class="mb-1 flex flex-wrap items-center gap-x-2 pr-8 text-xs font-semibold text-ink/50">
                <span class="text-accent">${esc(a.categoryLabel)}</span>
                <span aria-hidden="true">•</span><span>${a.readMinutes} min</span>
                <span aria-hidden="true">•</span><span>${timeAgo(minutesSince(a))}</span>
              </p>
              <h3 class="clamp-3 text-[15px] font-bold leading-snug">
                <a href="#/article/${encodeURIComponent(a.id)}"
                   class="after:absolute after:inset-0 after:rounded-3xl focus-visible:after:ring-2 focus-visible:after:ring-accent">${esc(a.headline)}</a>
              </h3>
            </div>
            <p class="mt-1.5 truncate text-xs font-medium text-ink/50">${esc(a.publisher)}</p>
          </div>
          <button type="button" data-bookmark="${esc(a.id)}" aria-pressed="${saved}" aria-label="${saved ? 'Remove bookmark' : 'Bookmark story'}"
            class="absolute right-1.5 top-1.5 z-10 flex h-9 w-9 items-center justify-center rounded-full ${saved ? 'text-accent' : 'text-ink/40'} active:scale-95 transition">
            ${bookmarkIcon(saved, 'h-5 w-5')}
          </button>
        </article>`;
    }

    function renderSaved() {
      const items = state.savedSession;
      const n = state.bookmarks.size;
      $('#savedCount').textContent = n === 1 ? '1 story' : n + ' stories';
      $('#savedEmpty').classList.toggle('hidden', items.length > 0);
      $('#savedList').innerHTML = items.map((a) => cardHTML(a, true)).join('');
      renderBadge();
    }

    function renderBadge() {
      const n = state.bookmarks.size;
      const b = $('#navBadge');
      b.textContent = n;
      b.classList.toggle('hidden', n === 0);
    }

    function renderHome() {
      renderHero(); renderTabs(); renderFeed(); renderBadge();
    }

    /* --------------------------- Reader render ------------------------- */
    function renderReader() {
      const a = getArticle(state.articleId);
      const el = $('#readerContent');

      if (!a) {
        el.innerHTML = `
          <div class="py-20 text-center">
            <p class="mb-2 text-xl font-bold">Story not found</p>
            <p class="mb-6 text-ink/60">It may have rotated out of today's brief.</p>
            <button type="button" data-back class="h-12 rounded-full bg-ink px-6 font-semibold text-white">Back to feed</button>
          </div>`;
        updateReaderBookmark();
        return;
      }

      const facts = (a.keyFacts || []).map((f, i) => `
        <li class="flex gap-3">
          <span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-accent text-xs font-bold text-white">${i + 1}</span>
          <span>${esc(f)}</span>
        </li>`).join('');

      const paragraphs = (a.body || []).map((p) => `<p>${esc(p)}</p>`).join('');

      el.innerHTML = `
        <article>
          ${(a.imageLarge || a.image) ? thumb(a.imageLarge || a.image, 'mb-5 h-52 w-full rounded-3xl') : ''}

          <p class="mb-3 flex flex-wrap items-center gap-x-2 gap-y-1 text-xs font-semibold text-ink/60">
            <span class="rounded-full bg-accent px-3 py-1 font-bold uppercase tracking-wide text-white">${esc(a.categoryLabel)}</span>
            <span>${a.readMinutes} min read</span><span aria-hidden="true">•</span>
            <span>${timeAgo(minutesSince(a))}</span>
          </p>

          <h1 class="mb-3 text-[26px] font-extrabold leading-tight tracking-tight">${esc(a.headline)}</h1>
          <p class="mb-6 text-sm font-semibold text-ink/60">${esc(a.publisher)}</p>

          <!-- Executive Key Facts box -->
          <section aria-labelledby="kf-title" class="mb-6 rounded-3xl border border-accent/20 bg-[#EEF1FD] p-5">
            <h2 id="kf-title" class="mb-3 flex items-center gap-2 text-sm font-extrabold uppercase tracking-wider text-accent">
              <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z" /></svg>
              Key Facts
            </h2>
            <ol class="reader-facts flex flex-col gap-3">${facts}</ol>
          </section>

          <!-- Direct source link -->
          <a href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener noreferrer"
             class="mb-8 flex h-14 items-center justify-between rounded-2xl bg-ink px-5 font-semibold text-white active:scale-[0.99] transition">
            <span>Read original at ${esc(a.publisher)}</span>
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" /></svg>
          </a>

          <!-- Full article text -->
          ${a.fullText === false ? `<p class="mb-4 rounded-2xl bg-[#FFF4E0] px-4 py-3 text-sm font-medium text-[#7A4B00]">Only a preview was available from ${esc(a.publisher)}. Tap "Read original" above for the complete story.</p>` : ''}
          <div class="mb-2 text-xs font-bold uppercase tracking-wider text-ink/40">${a.fullText === false ? 'Preview' : 'Full article'}</div>
          <div class="reader-body">${paragraphs}</div>

          <!-- Clear ending -->
          <div class="mt-10 rounded-3xl bg-white p-6 text-center ring-1 ring-black/5">
            <p class="mb-1 text-lg font-bold">That's the story.</p>
            <p class="mb-5 text-sm text-ink/60">You're done with this one.</p>
            <button type="button" data-back class="h-12 w-full rounded-full bg-ink px-6 font-semibold text-white active:scale-[0.99] transition">Back to feed</button>
          </div>
        </article>`;

      updateReaderBookmark();
    }

    function updateReaderBookmark() {
      const btn = $('#readerBookmark');
      const id = state.articleId;
      const saved = id ? state.bookmarks.has(id) : false;
      btn.dataset.bookmark = id || '';
      btn.setAttribute('aria-pressed', String(saved));
      btn.setAttribute('aria-label', saved ? 'Remove bookmark' : 'Bookmark story');
      btn.classList.toggle('text-accent', saved);
      btn.innerHTML = bookmarkIcon(saved);
      btn.classList.toggle('hidden', !id || !getArticle(id));
    }

    /* ---------------------------- Reader prefs ------------------------- */
    function applyPrefs() {
      const root = document.documentElement;
      root.style.setProperty('--reader-font', FONT_STACKS[state.prefs.font] || FONT_STACKS.atkinson);
      root.style.setProperty('--reader-size', SIZES[state.prefs.sizeIndex] + 'px');
      $('#sizeLabel').textContent = SIZES[state.prefs.sizeIndex];
      $$('[data-font]').forEach((b) => {
        const on = b.dataset.font === state.prefs.font;
        b.classList.toggle('bg-ink', on);
        b.classList.toggle('text-white', on);
        b.setAttribute('aria-pressed', String(on));
      });
    }

    function setPrefsOpen(open) {
      $('#prefsPanel').classList.toggle('hidden', !open);
      $('#prefsToggle').setAttribute('aria-expanded', String(open));
    }

    /* ------------------------------ Router ----------------------------- */
    function route() {
      const m = location.hash.match(/^#\/article\/(.+)$/);
      if (m) showReader(decodeURIComponent(m[1]));
      else if (location.hash === '#/saved') showSaved();
      else showHome();
    }

    function showView(name) {
      $('#homeView').classList.toggle('hidden', name !== 'home');
      $('#savedView').classList.toggle('hidden', name !== 'saved');
      $('#readerView').classList.toggle('hidden', name !== 'reader');
      $('#bottomNav').classList.toggle('hidden', name === 'reader');
      setPrefsOpen(false);
    }

    function setNav(active) {
      $$('.nav-btn').forEach((b) => {
        const on = b.dataset.nav === active;
        b.classList.toggle('text-white', on);
        b.classList.toggle('text-white/50', !on);
        if (on) b.setAttribute('aria-current', 'page');
        else b.removeAttribute('aria-current');
      });
    }

    function showReader(id) {
      if (state.view !== 'reader') {
        state.feedScroll = window.scrollY;
        state.returnTo = state.view;
        state.cameFromFeed = true;
      }
      state.view = 'reader';
      state.articleId = id;
      showView('reader');

      renderReader();
      const a = getArticle(id);
      document.title = a ? a.headline + ' · Daily Intelligence' : 'Daily Intelligence';
      window.scrollTo(0, 0);
      updateProgress();
    }

    function showHome() {
      const restore = state.view === 'reader' && state.returnTo === 'home';
      state.view = 'home';
      state.articleId = null;
      showView('home');
      setNav('home');
      document.title = 'Daily Intelligence';

      renderHome();
      requestAnimationFrame(() => window.scrollTo(0, restore ? state.feedScroll : 0));
    }

    function showSaved() {
      const returning = state.view === 'reader' && state.returnTo === 'saved';
      state.view = 'saved';
      state.articleId = null;
      showView('saved');
      setNav('bookmarks');
      document.title = 'Saved · Daily Intelligence';

      // Newest saves first. Keep the same list when returning from a story.
      if (!returning) state.savedSession = [...state.bookmarks.values()].reverse();
      renderSaved();
      requestAnimationFrame(() => window.scrollTo(0, returning ? state.feedScroll : 0));
    }

    function goBack() {
      if (state.cameFromFeed && history.length > 1) history.back();
      else location.hash = state.returnTo === 'saved' ? '#/saved' : '#/';
    }

    /* --------------------------- Progress bar -------------------------- */
    let progressTick = false;
    function updateProgress() {
      const bar = $('#progress');
      if (state.view !== 'reader') { bar.style.width = '0%'; return; }
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const pct = max > 0 ? Math.min(100, Math.max(0, (window.scrollY / max) * 100)) : 0;
      bar.style.width = pct + '%';
    }
    window.addEventListener('scroll', () => {
      if (progressTick) return;
      progressTick = true;
      requestAnimationFrame(() => { updateProgress(); progressTick = false; });
    }, { passive: true });

    /* ------------------------------ Events ----------------------------- */
    document.addEventListener('click', (e) => {
      // Close the text-settings panel when tapping elsewhere
      if (!e.target.closest('#prefsPanel') && !e.target.closest('#prefsToggle')) setPrefsOpen(false);

      if (e.target.closest('#prefsToggle')) {
        setPrefsOpen($('#prefsPanel').classList.contains('hidden'));
        return;
      }

      const fontBtn = e.target.closest('[data-font]');
      if (fontBtn) {
        state.prefs.font = fontBtn.dataset.font;
        savePrefs(); applyPrefs();
        return;
      }

      const sizeBtn = e.target.closest('[data-size]');
      if (sizeBtn) {
        const next = state.prefs.sizeIndex + Number(sizeBtn.dataset.size);
        state.prefs.sizeIndex = Math.min(SIZES.length - 1, Math.max(0, next));
        savePrefs(); applyPrefs();
        return;
      }

      if (e.target.closest('[data-back]')) { goBack(); return; }

      const tabBtn = e.target.closest('[data-tab]');
      if (tabBtn) {
        state.tab = tabBtn.dataset.tab;
        renderTabs(); renderFeed();
        return;
      }

      const bm = e.target.closest('[data-bookmark]');
      if (bm && bm.dataset.bookmark) {
        const id = bm.dataset.bookmark;
        if (state.bookmarks.has(id)) { state.bookmarks.delete(id); toast('Removed from saved'); }
        else {
          const a = getArticle(id);
          if (!a) return;
          state.bookmarks.set(id, snapshot(a));
          toast('Saved for later');
        }
        saveBookmarks();
        if (state.view === 'reader') { updateReaderBookmark(); renderBadge(); }
        else if (state.view === 'saved') renderSaved();
        else renderHome();
        return;
      }

      const nav = e.target.closest('[data-nav]');
      if (nav) {
        const which = nav.dataset.nav;
        if (which === 'home') {
          if (state.view === 'home') window.scrollTo({ top: 0, behavior: 'smooth' });
          else location.hash = '#/';
        }
        else if (which === 'bookmarks') {
          if (state.view !== 'saved') location.hash = '#/saved';
        }
        else toast('Coming in a later step');
        return;
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        setPrefsOpen(false);
      }
    });

    window.addEventListener('hashchange', route);

    /* ------------------------------ Init ------------------------------- */
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    $('#todayLabel').textContent = new Date().toLocaleDateString(undefined, {
      weekday: 'long', month: 'short', day: 'numeric'
    });
    applyPrefs();

    // Load the real brief if it exists; otherwise keep the placeholder stories.
    fetch('brief.json', { cache: 'no-cache' })
      .then((r) => (r.ok ? r.json() : Promise.reject(new Error('no brief'))))
      .then((data) => {
        if (data && Array.isArray(data.articles) && data.articles.length) {
          ARTICLES = data.articles;
          if (data.generatedAt) {
            const mins = Math.max(0, Math.round((Date.now() - new Date(data.generatedAt)) / 60000));
            $('#todayLabel').textContent += ' · Updated ' + timeAgo(mins);
          }
        }
      })
      .catch(() => { /* keep placeholder stories */ })
      .finally(route);
  </script>
</body>
</html>
