<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F5F1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Daily Intelligence" />
  <title>Daily Intelligence</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'] },
          colors: {
            canvas: '#F6F5F1',
            ink: '#1B1F2A',
            accent: '#3B5BDB'
          }
        }
      }
    };
  </script>

  <style>
    html { -webkit-text-size-adjust: 100%; }
    body { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    .safe-bottom { padding-bottom: max(0.75rem, env(safe-area-inset-bottom)); }
    .safe-top { padding-top: max(1rem, env(safe-area-inset-top)); }
    .clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    :focus-visible { outline: 3px solid #3B5BDB; outline-offset: 2px; border-radius: 12px; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>

<body class="bg-canvas text-ink font-sans antialiased">
  <!-- App shell: centered column so it looks intentional on desktop -->
  <div class="relative mx-auto min-h-screen w-full max-w-md bg-canvas md:border-x md:border-black/5">

    <!-- Header -->
    <header class="safe-top flex items-center justify-between px-5 pb-3">
      <div>
        <p id="todayLabel" class="text-xs font-medium uppercase tracking-wider text-ink/50"></p>
        <h1 class="text-2xl font-extrabold tracking-tight">Daily Intelligence</h1>
      </div>
    </header>

    <main class="px-5 pb-32">
      <!-- Hero / Featured -->
      <section aria-label="Top story" id="hero" class="mb-6"></section>

      <!-- Category tabs -->
      <nav aria-label="Categories" class="-mx-5 mb-4">
        <div id="tabs" role="tablist" class="no-scrollbar flex gap-2 overflow-x-auto px-5 py-1"></div>
      </nav>

      <!-- Feed -->
      <section aria-label="News feed">
        <div id="feed" class="flex flex-col gap-3" role="tabpanel"></div>
        <p id="empty" class="hidden py-12 text-center text-sm text-ink/50">Nothing here yet. You're all caught up.</p>
      </section>
    </main>

    <!-- Bottom navigation (docked, floating pill) -->
    <div class="pointer-events-none fixed inset-x-0 bottom-0 z-20">
      <div class="mx-auto w-full max-w-md px-5 safe-bottom">
        <nav aria-label="Primary" class="pointer-events-auto flex items-center justify-around rounded-full bg-ink px-2 py-2 shadow-xl shadow-black/20">
          <button data-nav="home" type="button" aria-label="Home" aria-current="page"
            class="nav-btn flex h-12 w-14 items-center justify-center rounded-full text-white">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955a1.125 1.125 0 0 1 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>
          </button>
          <button data-nav="search" type="button" aria-label="Search"
            class="nav-btn flex h-12 w-14 items-center justify-center rounded-full text-white/50">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg>
          </button>
          <button data-nav="bookmarks" type="button" aria-label="Bookmarks"
            class="nav-btn relative flex h-12 w-14 items-center justify-center rounded-full text-white/50">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z" /></svg>
            <span id="navBadge" class="absolute right-2 top-1.5 hidden min-w-[18px] rounded-full bg-accent px-1 text-center text-[11px] font-bold leading-[18px] text-white"></span>
          </button>
          <button data-nav="profile" type="button" aria-label="Profile and settings"
            class="nav-btn flex h-12 w-14 items-center justify-center rounded-full text-white/50">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" /></svg>
          </button>
        </nav>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" role="status" aria-live="polite"
      class="pointer-events-none fixed inset-x-0 bottom-28 z-30 mx-auto w-fit max-w-[90%] translate-y-2 rounded-full bg-ink px-4 py-2 text-sm font-medium text-white opacity-0 shadow-lg transition"></div>
  </div>

  <script>
    /* ------------------------------------------------------------------
     * MOCK DATA
     * Swap this array for the fetched brief.json later, e.g.:
     *   const ARTICLES = (await (await fetch('brief.json')).json()).articles;
     * Expected fields per article:
     *   id, category ('politics'|'technology'|'sports'), categoryLabel,
     *   headline, publisher, readMinutes, minutesAgo (or publishedAt ISO), image, featured
     * ------------------------------------------------------------------ */
    const CATEGORIES = [
      { id: 'latest',     label: 'Latest' },
      { id: 'politics',   label: 'Politics' },
      { id: 'technology', label: 'Technology' },
      { id: 'sports',     label: 'Sports' }
    ];

    const ARTICLES = [
      {
        id: 'a1', category: 'politics', categoryLabel: 'World', featured: true,
        headline: 'Global leaders reach landmark agreement on cross-border AI safety standards',
        publisher: 'Reuters', readMinutes: 3, minutesAgo: 18,
        image: 'https://picsum.photos/seed/world-summit/900/700'
      },
      {
        id: 'a2', category: 'technology', categoryLabel: 'Technology',
        headline: 'Chipmakers race to ship next-generation low-power processors for phones',
        publisher: 'The Verge', readMinutes: 4, minutesAgo: 42,
        image: 'https://picsum.photos/seed/chip-tech/300/300'
      },
      {
        id: 'a3', category: 'sports', categoryLabel: 'Sports',
        headline: 'Late goal secures dramatic comeback win in the league title race',
        publisher: 'ESPN', readMinutes: 2, minutesAgo: 75,
        image: 'https://picsum.photos/seed/soccer-goal/300/300'
      },
      {
        id: 'a4', category: 'politics', categoryLabel: 'Politics',
        headline: 'Senate committee advances bipartisan infrastructure funding package',
        publisher: 'AP News', readMinutes: 5, minutesAgo: 110,
        image: 'https://picsum.photos/seed/capitol-hill/300/300'
      },
      {
        id: 'a5', category: 'technology', categoryLabel: 'Technology',
        headline: 'Open-source security team patches critical flaw affecting popular web servers',
        publisher: 'Ars Technica', readMinutes: 4, minutesAgo: 160,
        image: 'https://picsum.photos/seed/cyber-security/300/300'
      },
      {
        id: 'a6', category: 'sports', categoryLabel: 'Sports',
        headline: 'Rookie guard posts career-high points as home team extends win streak',
        publisher: 'The Athletic', readMinutes: 3, minutesAgo: 230,
        image: 'https://picsum.photos/seed/basketball-court/300/300'
      },
      {
        id: 'a7', category: 'politics', categoryLabel: 'World',
        headline: 'Climate talks resume as nations weigh updated emissions targets',
        publisher: 'BBC News', readMinutes: 6, minutesAgo: 300,
        image: 'https://picsum.photos/seed/climate-talks/300/300'
      },
      {
        id: 'a8', category: 'technology', categoryLabel: 'Technology',
        headline: 'New on-device language models promise faster, more private assistants',
        publisher: 'Wired', readMinutes: 5, minutesAgo: 380,
        image: 'https://picsum.photos/seed/ondevice-ai/300/300'
      }
    ];

    /* ------------------------------ State ------------------------------ */
    const STORAGE_KEY = 'di_bookmarks_v1';
    const state = {
      tab: 'latest',
      bookmarks: new Set(loadBookmarks())
    };

    function loadBookmarks() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch (e) { return []; }
    }
    function saveBookmarks() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...state.bookmarks])); }
      catch (e) { /* storage unavailable: keep in-memory only */ }
    }

    /* ------------------------------ Helpers ---------------------------- */
    const $ = (sel) => document.querySelector(sel);

    function esc(str) {
      return String(str).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function timeAgo(mins) {
      if (mins < 1) return 'Just now';
      if (mins < 60) return mins + 'm ago';
      const h = Math.floor(mins / 60);
      if (h < 24) return h + 'h ago';
      return Math.floor(h / 24) + 'd ago';
    }

    function minutesSince(a) {
      if (typeof a.minutesAgo === 'number') return a.minutesAgo;
      if (a.publishedAt) return Math.max(0, Math.round((Date.now() - new Date(a.publishedAt)) / 60000));
      return 0;
    }

    function bookmarkIcon(active) {
      return `<svg class="h-6 w-6" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"
        fill="${active ? 'currentColor' : 'none'}" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0Z"/>
      </svg>`;
    }

    let toastTimer;
    function toast(msg) {
      const el = $('#toast');
      el.textContent = msg;
      el.classList.remove('opacity-0', 'translate-y-2');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('opacity-0', 'translate-y-2'), 1800);
    }

    /* ------------------------------ Render ----------------------------- */
    function renderHero() {
      const a = ARTICLES.find((x) => x.featured) || ARTICLES[0];
      if (!a) { $('#hero').innerHTML = ''; return; }
      const saved = state.bookmarks.has(a.id);
      $('#hero').innerHTML = `
        <article class="relative h-80 overflow-hidden rounded-[28px] bg-ink shadow-lg shadow-black/10">
          <img src="${esc(a.image)}" alt="" class="absolute inset-0 h-full w-full object-cover" loading="eager" />
          <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/50 to-black/10"></div>

          <div class="absolute inset-x-0 top-0 flex items-start justify-between p-4">
            <span class="rounded-full bg-white px-3 py-1.5 text-xs font-bold uppercase tracking-wide text-ink">${esc(a.categoryLabel)}</span>
            <button type="button" data-bookmark="${esc(a.id)}" aria-pressed="${saved}" aria-label="${saved ? 'Remove bookmark' : 'Bookmark story'}"
              class="flex h-12 w-12 items-center justify-center rounded-full bg-white/90 text-ink backdrop-blur active:scale-95 transition">
              ${bookmarkIcon(saved)}
            </button>
          </div>

          <div class="absolute inset-x-0 bottom-0 p-5 text-white">
            <p class="mb-2 flex items-center gap-2 text-xs font-semibold text-white/80">
              <span>${esc(a.publisher)}</span><span aria-hidden="true">•</span>
              <span>${a.readMinutes} min read</span><span aria-hidden="true">•</span>
              <span>${timeAgo(minutesSince(a))}</span>
            </p>
            <h2 class="text-[22px] font-extrabold leading-tight tracking-tight">${esc(a.headline)}</h2>
          </div>
        </article>`;
    }

    function renderTabs() {
      $('#tabs').innerHTML = CATEGORIES.map((c) => {
        const active = c.id === state.tab;
        return `<button type="button" role="tab" aria-selected="${active}" data-tab="${c.id}"
          class="shrink-0 rounded-full px-5 py-3 text-sm font-semibold transition active:scale-95
          ${active ? 'bg-ink text-white shadow-md' : 'bg-white text-ink/70 ring-1 ring-black/5'}">${esc(c.label)}</button>`;
      }).join('');
    }

    function renderFeed() {
      const heroId = (ARTICLES.find((x) => x.featured) || ARTICLES[0] || {}).id;
      const items = ARTICLES
        .filter((a) => a.id !== heroId)
        .filter((a) => state.tab === 'latest' || a.category === state.tab)
        .sort((a, b) => minutesSince(a) - minutesSince(b));

      $('#empty').classList.toggle('hidden', items.length > 0);

      $('#feed').innerHTML = items.map((a) => {
        const saved = state.bookmarks.has(a.id);
        return `
        <article class="flex gap-4 rounded-3xl bg-white p-3 shadow-sm ring-1 ring-black/5">
          <img src="${esc(a.image)}" alt="" loading="lazy"
            class="h-28 w-28 shrink-0 rounded-2xl bg-ink/5 object-cover" />
          <div class="flex min-w-0 flex-1 flex-col justify-between py-0.5">
            <div>
              <p class="mb-1 flex flex-wrap items-center gap-x-2 text-xs font-semibold text-ink/50">
                <span class="text-accent">${esc(a.categoryLabel)}</span>
                <span aria-hidden="true">•</span><span>${a.readMinutes} min</span>
                <span aria-hidden="true">•</span><span>${timeAgo(minutesSince(a))}</span>
              </p>
              <h3 class="clamp-3 text-[15px] font-bold leading-snug">${esc(a.headline)}</h3>
            </div>
            <div class="mt-1 flex items-center justify-between">
              <span class="truncate text-xs font-medium text-ink/50">${esc(a.publisher)}</span>
              <button type="button" data-bookmark="${esc(a.id)}" aria-pressed="${saved}" aria-label="${saved ? 'Remove bookmark' : 'Bookmark story'}"
                class="-mr-1 flex h-12 w-12 items-center justify-center rounded-full ${saved ? 'text-accent' : 'text-ink/40'} active:scale-95 transition">
                ${bookmarkIcon(saved)}
              </button>
            </div>
          </div>
        </article>`;
      }).join('');
    }

    function renderBadge() {
      const n = state.bookmarks.size;
      const b = $('#navBadge');
      b.textContent = n;
      b.classList.toggle('hidden', n === 0);
    }

    function renderAll() {
      renderHero(); renderTabs(); renderFeed(); renderBadge();
    }

    /* ------------------------------ Events ----------------------------- */
    document.addEventListener('click', (e) => {
      const tabBtn = e.target.closest('[data-tab]');
      if (tabBtn) {
        state.tab = tabBtn.dataset.tab;
        renderTabs(); renderFeed();
        return;
      }

      const bm = e.target.closest('[data-bookmark]');
      if (bm) {
        const id = bm.dataset.bookmark;
        if (state.bookmarks.has(id)) { state.bookmarks.delete(id); toast('Removed from saved'); }
        else { state.bookmarks.add(id); toast('Saved for later'); }
        saveBookmarks();
        renderHero(); renderFeed(); renderBadge();
        return;
      }

      const nav = e.target.closest('[data-nav]');
      if (nav) {
        if (nav.dataset.nav !== 'home') toast('Coming in a later step');
        return;
      }
    });

    /* ------------------------------ Init ------------------------------- */
    $('#todayLabel').textContent = new Date().toLocaleDateString(undefined, {
      weekday: 'long', month: 'short', day: 'numeric'
    });
    renderAll();
  </script>
</body>
</html>
